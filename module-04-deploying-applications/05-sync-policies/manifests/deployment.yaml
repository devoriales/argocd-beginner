apiVersion: apps/v1
kind: Deployment
metadata:
  name: autosync
spec:
  replicas: 1
  selector:
    matchLabels: {app: autosync}
  template:
    metadata:
      labels: {app: autosync}
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
