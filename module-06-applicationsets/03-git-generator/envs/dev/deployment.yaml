# One directory per environment. The Git generator turns each of these into an
# Application automatically, so adding an environment is adding a folder.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-dev
  template:
    metadata:
      labels:
        app: web-dev
    spec:
      containers:
        - name: web
          image: nginx:1.29-alpine
