apiVersion: batch/v1
kind: Job
metadata:
  name: policies-succeeded
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: policies-succeeded
    spec:
      restartPolicy: Never
      containers:
        - name: h
          image: busybox:1.37
          command: ["sh", "-c", "echo 'succeeded'; sleep 2"]
