# The one file you apply by hand. Everything else in the platform is discovered
# through it, which is why Module 10 argues for alerting on this Application by
# name: if root stops reconciling, every layer beneath it silently goes stale.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/devoriales/argocd-beginner.git
    targetRevision: main
    path: module-12-capstone/01-repo-structure/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    # Applications and AppProjects live in argocd, so that is where root deploys.
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
