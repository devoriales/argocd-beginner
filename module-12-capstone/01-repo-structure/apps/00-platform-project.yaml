# Wave -1: the project must exist before any Application that references it.
# Module 5's first ordering rule, applied to the platform's own resources.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Applications the platform team owns.
  sourceRepos:
    - https://github.com/devoriales/argocd-beginner.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: 'platform-*'
  # Module 8 recommends an empty clusterResourceWhitelist for tenant projects, and
  # that is right for tenants. It cannot be empty here, because the Applications
  # below use CreateNamespace=true and a Namespace is cluster-scoped.
  #
  # Getting this wrong fails in the worst way: the child Application sits at
  # OutOfSync/Missing with NO conditions, and the real message is only in
  # status.operationState.syncResult:
  #   resource :Namespace is not permitted in project platform
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
