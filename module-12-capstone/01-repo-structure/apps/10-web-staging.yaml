# Wave 0: created after the project above exists. Adding an environment here is
# adding one file, which is the whole argument for app-of-apps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-web-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform
  source:
    repoURL: https://github.com/devoriales/argocd-beginner.git
    targetRevision: main
    path: module-06-applicationsets/03-git-generator/envs/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
